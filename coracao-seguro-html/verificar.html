<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coração Seguro - Verificar Perfil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell" id="pagina-verificar">
    <div class="app-conteudo">

      <header>
        <h1>Verificar Perfil</h1>
        <hr class="divisor">
        <h2>Diagnóstico de glicemia</h2>
        <p class="texto-suave">
          Responda sinceramente a estas perguntas sobre sua saúde.
        </p>
      </header>

      <form id="formulario-perfil">
        <div class="opcoes-perfil">

          <label class="cartao opcao-perfil" for="perfil-favor-saúde">
            <input id="perfil-favor-saúde" name="sinais" type="checkbox">
            <span>esta com cansaço extremo?</span>
          </label>

          <label class="cartao opcao-perfil" for="perfil-recusa-video">
            <input id="perfil-recusa-video" name="sinais" type="checkbox">
            <span>dor de cabeça diariamente?</span>
          </label>

          <label class="cartao opcao-perfil" for="perfil-amor-rapido">
            <input id="perfil-amor-rapido" name="sinais" type="checkbox">
            <span>visão turva?</span>
          </label>

          <label class="cartao opcao-perfil" for="perfil-evita-encontro">
            <input id="perfil-evita-encontro" name="sinais" type="checkbox">
            <span>sensação de desmaio?</span>
          </label>

        </div>

        <button class="botao-primario" id="botao-verificar-sinais" type="submit">
          ♢ Verificar sintomas
        </button>

        <div class="resultado-perfil" id="resultado-perfil" aria-live="polite"></div>

        <p class="splash-rodape">
          Lembre-se esses sintomas são confidencais, e compartilhados com familiares proximos.
        </p>
      </form>
    </div>

    
<nav class="navegacao-inferior" aria-label="Navegação principal">

    <span>Verificar</span>
  </a>
  <a class="link-navegacao " href="ajuda.html" id="nav-ajuda">
    <span class="icone-nav">ⓘ</span>
    <span>Ajuda</span>
  </a>
</nav>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
